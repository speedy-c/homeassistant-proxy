
name: Home Assistant gzip proxy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: homeassistant-gzip-publish
  cancel-in-progress: false

jobs:
  convert-and-push:
    name: Convert and publish Home Assistant
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | \
            skopeo login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin \
              docker.io

      - name: Convert image to gzip and push
        run: |
          skopeo copy \
            --all \
            --format v2s2 \
            --dest-compress-format gzip \
            --retry-times 3 \
            docker://ghcr.io/home-assistant/home-assistant:stable \
            docker://docker.io/speedyc/home-assistant:latest

      - name: Verify published image
        run: |
          skopeo inspect --raw \
            docker://docker.io/speedyc/home-assistant:latest \
            > /dev/null

          echo "Image published successfully:"
          echo "speedyc/home-assistant:latest"

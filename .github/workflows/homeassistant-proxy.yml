
name: Home Assistant Proxy DS218+

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: homeassistant-ds218-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Login to Docker Hub
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$TOKEN" | skopeo login \
            --username "$USERNAME" \
            --password-stdin docker.io

      - name: Convert amd64 image to gzip
        run: |
          skopeo --override-arch amd64 copy \
            --format v2s2 \
            --dest-compress-format gzip \
            --retry-times 3 \
            docker://ghcr.io/home-assistant/home-assistant:stable \
            docker://docker.io/speedyc/home-assistant:latest

      - name: Verify image
        run: |
          skopeo inspect \
            docker://docker.io/speedyc/home-assistant:latest
